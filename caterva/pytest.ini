[pytest]
testpaths = tests
# Both entries are load-bearing after the package split:
#   .   lets `from caterva_engine import ...` keep working in the tests
#   ..  puts the repo root on sys.path so the shim's `caterva.core.*`
#       imports resolve. Without it the shim falls back to treating
#       `continuous`/`discrete` as top-level packages, and their relative
#       imports (`..core.data_structures`) then fail with
#       "attempted relative import beyond top-level package".
pythonpath = . ..
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
markers =
    timeout: pytest-timeout marker
