[pytest]
# Only collect files matching test_*.py as test modules. The Tests/ folder
# also holds one-off exploratory scripts (big_test.py, pubmed_test.py, etc.)
# that match pytest's default *_test.py pattern and execute network/API
# calls at import time - restricting python_files keeps `pytest` runnable
# from this directory without those scripts interfering.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `.` for this directory's own modules, `..` for the repository root.
#
# WHY `..` IS LOAD-BearING
# ------------------------
# `spread_consequence.py` imports the engine lazily, at the point it needs
# to run a model:
#
#     from Terium.continuous.simulations import simulate_michaelis_menten
#
# `Terium` lives at the repository root, so that import resolves when pytest
# is run from the root and fails when it is run from inside this directory.
# The result was a suite whose colour depended on the working directory:
# `pytest test_lab_report.py` from here reported 2 failures, and the same
# file from the root passed. A contributor sees a red suite and reasonably
# concludes they broke something.
#
# `Terium/pytest.ini` has carried `pythonpath = . ..` for exactly this
# reason since the package split. This directory never got the same line.
#
# Found by `scripts/mutate.py`, which refused to grade ADR 0133's mutation
# table against a red baseline -- "a test that was already failing 'catches'
# everything". The harness would not produce a verdict, and the reason it
# gave was the bug.
pythonpath = . ..
