[pytest]
# Only collect files matching test_*.py as test modules. The Tests/ folder
# also holds one-off exploratory scripts (big_test.py, pubmed_test.py, etc.)
# that match pytest's default *_test.py pattern and execute network/API
# calls at import time - restricting python_files keeps `pytest` runnable
# from this directory without those scripts interfering.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
