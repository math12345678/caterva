name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor Terrium supports; 3.12 is the ceiling with
        # prebuilt wheels for the SBML C extensions. Testing both ends
        # catches version drift before it reaches anyone's laptop.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify the environment is genuinely working
        run: python scripts/check_env.py

      - name: Simulation engine tests
        working-directory: Tellurium
        run: python -m pytest -v

      - name: Literature layer tests
        working-directory: Tests
        run: python -m pytest -v
