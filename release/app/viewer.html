<!doctype html>
<meta charset="utf-8">
<title>Terrium</title>
<!--
  The viewer displays the document the builder produced. It does not write one.

  scripts/demo.py states the rule this file obeys, and states why:

      "A demo with its own rendering path is the worst kind of check that
       cannot fail: it keeps looking impressive while the product it
       advertises rots."

  So the markdown shown here is exactly the bytes `report_lab.py` returned.
  The JavaScript below is a *typesetter*, not an author: it turns the six
  constructs that builder emits -- h1, h2, paragraphs, tables, unordered
  lists, horizontal rules, plus bold -- into elements, and refuses anything
  it does not recognise loudly rather than silently dropping it.

  That refusal is the point. A renderer that quietly skips an unfamiliar
  line would make a report look complete while omitting the part the builder
  went to the trouble of saying -- which, in a document whose entire purpose
  is to disclose where numbers came from, is the worst thing it could do.
-->
<style>
  :root {
    --bg: #fbfaf8; --panel: #ffffff; --ink: #1a1a1a; --muted: #5b5b5b;
    --line: #e2ded7; --accent: #1f5d3f; --warn-bg: #fff8e6; --warn-line: #e0c060;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a; --panel: #1e2124; --ink: #e9e6e1; --muted: #a3a09b;
      --line: #33373b; --accent: #6fbf95; --warn-bg: #2a2519; --warn-line: #6b5a2a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); flex: 0 0 auto;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  header .spacer { flex: 1; }
  button {
    font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }
  main { flex: 1; overflow-y: auto; padding: 30px 22px 60px; }
  .doc { max-width: 760px; margin: 0 auto; }
  .doc h1 { font-size: 25px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .doc h2 {
    font-size: 15px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); margin: 34px 0 10px; font-weight: 650;
  }
  .doc p { margin: 12px 0; }
  .doc ul { margin: 12px 0; padding-left: 20px; }
  .doc li { margin: 5px 0; }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 30px 0; }
  .doc table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 13.5px; }
  .doc th, .doc td {
    text-align: left; padding: 7px 11px; border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  .doc th { font-weight: 650; color: var(--muted); font-size: 12px;
            text-transform: uppercase; letter-spacing: 0.05em; }
  .doc td:first-child, .doc th:first-child { padding-left: 0; }
  .doc code { font-family: var(--mono); font-size: 12.5px;
              background: rgba(127,127,127,0.12); padding: 1px 5px; border-radius: 4px; }
  .doc strong { font-weight: 650; }
  .status { color: var(--muted); font-size: 13.5px; }
  .lesson {
    border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px;
    margin: 0 0 26px; background: var(--panel);
  }
  .lesson h3 { margin: 0 0 4px; font-size: 12px; letter-spacing: 0.07em;
               text-transform: uppercase; color: var(--accent); font-weight: 650; }
  .lesson .q { margin: 8px 0 16px; font-size: 16px; line-height: 1.5; }
  .lesson .choice {
    display: block; width: 100%; text-align: left; margin: 7px 0;
    padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font-size: 14px; cursor: pointer;
  }
  .lesson .choice:hover:not(:disabled) { border-color: var(--accent); }
  .lesson .choice.right { border-color: var(--accent); background: rgba(31,93,63,0.09); }
  .lesson .choice.wrong { border-color: var(--warn-line); background: var(--warn-bg); }
  .lesson .verdict { margin: 16px 0 6px; font-weight: 650; }
  .lesson .why { margin: 8px 0; }
  .lesson .caution { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line);
                     color: var(--muted); font-size: 13px; }
  .lesson .skip { background: none; border: 0; color: var(--muted); font-size: 12.5px;
                  cursor: pointer; padding: 6px 0; text-decoration: underline; }
  .failure {
    background: var(--warn-bg); border: 1px solid var(--warn-line);
    border-radius: 8px; padding: 14px 16px; margin: 16px 0;
    font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap;
  }
  .failure h3 { margin: 0 0 8px; font-family: -apple-system, system-ui, sans-serif;
                font-size: 14px; }
</style>

<header>
  <h1>Terrium</h1>
  <span class="sub" id="subtitle">Lactate dehydrogenase &middot; offline</span>
  <span class="spacer"></span>
  <button id="save">Save report…</button>
  <button id="run" class="primary">Run again</button>
</header>
<main><div class="doc" id="doc"><p class="status">Running the simulation…</p></div></main>

<script src="lesson.js"></script>
<script>
"use strict";

/**
 * Escape text before it becomes HTML.
 *
 * The report contains user-supplied strings (an enzyme name, a question) and
 * database text. None of it is trusted as markup.
 */
function esc(s) {
  return s.replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

/** Inline spans: bold and code. Applied after escaping, never before. */
function inline(s) {
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}

const isTableRow = l => l.startsWith("|") && l.endsWith("|");
// Requires a dash. The real report contains `| | |` -- an empty header row
// -- and a divider test that accepts it silently eats that row.
const isDivider  = l => /^\|[\s:|-]*-[\s:|-]*\|$/.test(l);
const cells      = l => l.slice(1, -1).split("|").map(c => c.trim());

/**
 * Typeset the builder's markdown.
 *
 * Returns {html, unhandled}. `unhandled` lists any line this does not
 * recognise. The caller shows them rather than dropping them: in a document
 * whose purpose is disclosure, a silently omitted line is the worst possible
 * failure, and it is exactly the kind that looks fine on screen.
 */
function typeset(md) {
  const lines = md.split("\n");
  const out = [];
  const unhandled = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];
    const t = line.trim();

    if (t === "") { i++; continue; }

    if (t.startsWith("# "))  { out.push(`<h1>${inline(t.slice(2))}</h1>`); i++; continue; }
    if (t.startsWith("## ")) { out.push(`<h2>${inline(t.slice(3))}</h2>`); i++; continue; }
    if (/^-{3,}$/.test(t))   { out.push("<hr>"); i++; continue; }

    if (isTableRow(t)) {
      const head = cells(t);
      let j = i + 1;
      const hasDivider = j < lines.length && isDivider(lines[j].trim());
      if (hasDivider) j++;
      const body = [];
      while (j < lines.length && isTableRow(lines[j].trim())) {
        body.push(cells(lines[j].trim())); j++;
      }
      const th = head.map(c => `<th>${inline(c)}</th>`).join("");
      const tr = body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("");
      out.push(`<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`);
      i = j; continue;
    }

    if (t.startsWith("- ")) {
      const items = [];
      while (i < lines.length && lines[i].trim().startsWith("- ")) {
        items.push(`<li>${inline(lines[i].trim().slice(2))}</li>`); i++;
      }
      out.push(`<ul>${items.join("")}</ul>`); continue;
    }

    // Markdown this viewer does not implement. Named explicitly, because the
    // paragraph branch below would otherwise absorb every one of them and
    // render a blockquote or a code fence as ordinary prose.
    //
    // The first version had no such branch, and `unhandled` was therefore
    // unreachable: a blockquote came out as a paragraph and the "lines this
    // viewer does not know how to typeset" banner never appeared. A check
    // that cannot fire is worse than no check, and this file's own header
    // says so, which is how it was found.
    if (/^(>|```|~~~|\d+[.)]\s|!\[|#{3,}\s)/.test(t)) {
      unhandled.push(line); i++; continue;
    }

    // A paragraph: consecutive plain lines, joined.
    const para = [];
    while (i < lines.length) {
      const p = lines[i].trim();
      if (p === "" || p.startsWith("#") || isTableRow(p) || p.startsWith("- ") || /^-{3,}$/.test(p)) break;
      para.push(p); i++;
    }
    if (para.length) out.push(`<p>${inline(para.join(" "))}</p>`);
    else { unhandled.push(line); i++; }
  }

  return { html: out.join("\n"), unhandled };
}

const doc = document.getElementById("doc");
const runBtn = document.getElementById("run");
const saveBtn = document.getElementById("save");
let currentMarkdown = "";

function showFailure(title, detail) {
  doc.innerHTML =
    `<div class="failure"><h3>${esc(title)}</h3>${esc(detail)}</div>` +
    `<p class="status">Nothing was written. This is a failure, not an empty report.</p>`;
}

/**
 * Show the question before the answer.
 *
 * The report already contains this lesson and states it as a lecture. All
 * this does is withhold the number for as long as it takes to ask what the
 * reader expects -- which is the difference between being told that a 13x
 * disagreement in Km barely moves the answer, and finding out you thought it
 * would.
 *
 * If `lessonFrom` refuses -- because the literature reported one value, and
 * there is nothing to compare -- the report is shown directly. It does not
 * invent a question to have one.
 */
function renderLesson(markdown, onDone) {
  const lesson = window.lessonFrom ? window.lessonFrom(markdown) : { ok: false };
  if (!lesson.ok) { onDone(); return; }

  const panel = document.createElement("div");
  panel.className = "lesson";
  panel.innerHTML =
    `<h3>Before the answer</h3><p class="q">${esc(lesson.question)}</p>` +
    lesson.choices.map(c =>
      `<button class="choice" data-id="${esc(c.id)}">${esc(c.label)}</button>`).join("") +
    `<button class="skip" id="lesson-skip">Skip to the report</button>`;
  doc.innerHTML = "";
  doc.appendChild(panel);

  const finish = (chosenId) => {
    for (const b of panel.querySelectorAll(".choice")) {
      b.disabled = true;
      if (b.dataset.id === lesson.correctId) b.classList.add("right");
      else if (b.dataset.id === chosenId) b.classList.add("wrong");
    }
    const right = chosenId === lesson.correctId;
    const verdict = document.createElement("div");
    verdict.innerHTML =
      `<p class="verdict">${right ? "Yes." : "Not quite."} ${esc(lesson.reveal)}</p>` +
      `<p class="why">${esc(lesson.mechanism)}</p>` +
      `<p class="caution">${esc(lesson.caution)}</p>`;
    panel.querySelector("#lesson-skip").remove();
    panel.appendChild(verdict);
    onDone(panel);
  };

  for (const b of panel.querySelectorAll(".choice")) {
    b.addEventListener("click", () => finish(b.dataset.id));
  }
  panel.querySelector("#lesson-skip").addEventListener("click", () => {
    panel.remove();
    onDone();
  });
}

function render(markdown) {
  currentMarkdown = markdown;
  const { html, unhandled } = typeset(markdown);
  let banner = "";
  if (unhandled.length) {
    // Surfaced, never swallowed. See the comment at the top of this file.
    banner =
      `<div class="failure"><h3>${unhandled.length} line(s) this viewer does not ` +
      `know how to typeset</h3>They are shown verbatim so nothing the builder ` +
      `said is lost:\n\n${esc(unhandled.join("\n"))}</div>`;
  }
  const keep = doc.querySelector(".lesson");
  doc.innerHTML = banner + html;
  if (keep) doc.insertBefore(keep, doc.firstChild);
  saveBtn.disabled = false;
}

/** Called by the app shell with the builder's JSON result. */
window.terriumResult = function (payload) {
  runBtn.disabled = false;
  if (!payload || payload.ok !== true || typeof payload.markdown !== "string") {
    showFailure(
      "The report could not be built",
      (payload && (payload.error || payload.detail)) || "The builder returned no document."
    );
    saveBtn.disabled = true;
    return;
  }
  renderLesson(payload.markdown, () => render(payload.markdown));
};

window.terriumBusy = function () {
  runBtn.disabled = true;
  saveBtn.disabled = true;
  doc.innerHTML = `<p class="status">Running the simulation…</p>`;
};

runBtn.addEventListener("click", () => {
  window.terriumBusy();
  window.webkit.messageHandlers.terrium.postMessage({ action: "run" });
});

saveBtn.addEventListener("click", () => {
  window.webkit.messageHandlers.terrium.postMessage({
    action: "save", markdown: currentMarkdown
  });
});
</script>
