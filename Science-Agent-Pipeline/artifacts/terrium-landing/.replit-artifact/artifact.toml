kind = "web"
previewPath = "/"
title = "Terrium Landing Page"
version = "1.0.0"
id = "artifacts/terrium-landing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18612

[services.development]
run = "pnpm --filter @workspace/terrium-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/terrium-landing", "run", "build" ]
serve = "static"
publicDir = "artifacts/terrium-landing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18612"
BASE_PATH = "/"
