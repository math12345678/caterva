openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: simulate
    description: Science agent simulation pipeline
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /simulate:
    get:
      operationId: listSimulationJobs
      tags: [simulate]
      summary: List recent simulation jobs
      description: |
        Returns the most recent simulation jobs from the in-memory queue,
        ordered by updatedAt descending. Completed jobs include their
        result; failed jobs include the error.
      responses:
        "200":
          description: List of recent simulation jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimulationJob"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: runSimulation
      tags: [simulate]
      summary: Submit a science-agent simulation job
      description: |
        Accepts a natural-language request, enqueues an simulation job, and
        returns a job object. Poll `GET /simulate/{jobId}` or subscribe to
        `GET /simulate/{jobId}/stream` for real-time progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationRequest"
      responses:
        "202":
          description: Simulation job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationJob"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Simulation or pipeline failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /simulate/{jobId}:
    get:
      operationId: getSimulationJob
      tags: [simulate]
      summary: Get a simulation job by ID
      description: |
        Returns the current job status and, when completed, the full
        simulation result.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /simulate/{jobId}/stream:
    get:
      operationId: streamSimulationJob
      tags: [simulate]
      summary: Stream simulation job progress
      description: |
        Server-Sent Events endpoint that emits status updates and the final
        result for a simulation job.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE stream of job events
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SimulationJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SimulationRequest:
      type: object
      properties:
        query:
          type: string
          description: Natural-language simulation request (e.g. "simulate lactate dehydrogenase with pyruvate")
        allowCrossSpecies:
          type: boolean
          default: false
          description: >
            Permit a measured parameter from a different but sufficiently
            related organism when the requested organism has none. Off by
            default (ADR 0024). Even when enabled, candidates must pass an
            NCBI Taxonomy relatedness check -- enabling this permits a value
            from a related organism, not from any organism. A value obtained
            this way is still not a measurement of the organism you asked
            about.
        allowVariants:
          type: boolean
          default: false
          description: >
            Permit a measured parameter from a protein VARIANT -- a point
            mutant, or a named isozyme -- rather than the enzyme as found.
            Off by default (ADR 0029).

            BRENDA's commentary says things like "Y124C mutant" and "isozyme
            H4" in the same string that carries pH and temperature. Rows that
            say so are removed before selection, because selection takes the
            minimum and active-site substitutions are chosen precisely
            BECAUSE they change the kinetics -- in the acetylcholinesterase
            turnover table the lowest mutant kcat sits twelve times below the
            lowest wild-type one.

            Enabling this permits a value measured on a different protein.
            The result describes that variant, not the enzyme you named.

            Note the limit: a row whose commentary does not say either way is
            USABLE and uncertified. BRENDA does not require curators to write
            "wild-type", so an unlabelled mutant still passes regardless of
            this flag.
        physiologicalReference:
          type: object
          description: >
            The pH and temperature the model is meant to represent, plus how
            far a measurement may drift from them before it stops
            representing the modelled system. Used to grade the
            `conditionProximity` axis of a resolved parameter's reliability
            (ADR 0024 Decision 3, ADR 0027).

            Optional, and never defaulted. "Physiological" has no
            organism-independent value: pH 7.4 and 37 C describe a mammal
            and misdescribe Thermus thermophilus, whose enzymes are measured
            near 70 C. Omit it and the axis reports `not_assessed` and says
            why, which is true; supplying a guess would report a confident
            `far` for a thermophile assay that was in fact ideal.

            ALL FIVE FIELDS ARE REQUIRED IF THE OBJECT IS PRESENT. A partial
            reference is refused rather than completed -- half a reference
            plus an assumed 37 C is an assumed mammal.
          properties:
            ph:
              type: number
              description: pH the model represents.
            temperatureC:
              type: number
              description: Temperature in degrees Celsius the model represents.
            basis:
              type: string
              description: >
                Where these conditions came from -- a citation, a species, or
                the caller. Required so a reference can never be traced back
                to "someone typed it".
            phTolerance:
              type: number
              description: >
                How far a measured pH may sit from the reference before the
                value stops representing the modelled system. A property of
                the enzyme, so it is stated rather than assumed.
            temperatureToleranceC:
              type: number
              description: As phTolerance, in degrees Celsius.
          required:
            - ph
            - temperatureC
            - basis
            - phTolerance
            - temperatureToleranceC
      required:
        - query
    SimulationJobStatus:
      type: string
      enum: [pending, resolving, validating, running, completed, failed]
      description: Current pipeline stage for a submitted job
    SimulationJob:
      type: object
      properties:
        jobId:
          type: string
          description: Unique identifier for this pipeline run
        status:
          $ref: "#/components/schemas/SimulationJobStatus"
        query:
          type: string
          description: Original natural-language query
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Completion percentage based on pipeline stage
        result:
          $ref: "#/components/schemas/SimulationResponse"
        error:
          $ref: "#/components/schemas/ErrorResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - jobId
        - status
        - query
        - progress
        - createdAt
        - updatedAt
    SimulationResponse:
      type: object
      properties:
        runId:
          type: string
          description: Unique identifier for this pipeline run
        domain:
          type: string
          enum:
            [
              mm,
              mm_competitive_inhibition,
              sir,
              seir,
              pcr,
              monte_carlo_pi,
              wright_fisher,
              two_locus_wright_fisher,
              molecular_dynamics,
              gillespie_ssa,
              gillespie_ssa_bimolecular,
              gillespie_ssa_replicates,
              lotka_volterra,
              cell_cycle_oscillator,
              repressilator,
              sbml,
            ]
          description: Resolved simulation domain
        parameters:
          type: object
          description: Resolved simulation parameters
          additionalProperties: true
        trajectory:
          type: array
          description: Time-series output from the simulation engine
          items:
            type: object
            additionalProperties: true
        provenance:
          $ref: "#/components/schemas/Provenance"
        parameterProvenance:
          type: object
          description: Per-parameter provenance; exactly one entry per key in parameters (ADR 0008)
          additionalProperties:
            $ref: "#/components/schemas/ParameterProvenance"
        completedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the run finished
      required:
        - runId
        - domain
        - parameters
        - trajectory
        - provenance
        - parameterProvenance
        - completedAt
    Provenance:
      type: object
      properties:
        modelCitations:
          type: array
          description: Literature references for the MODEL/domain, never for individual parameter values (ADR 0008)
          items:
            type: string
        flags:
          type: array
          description: Human-readable warnings about the parameters or result
          items:
            type: string
        reasoning:
          type: string
          description: Short explanation of how the query was mapped to a domain
      required: []
    ParameterProvenance:
      type: object
      properties:
        origin:
          type: string
          enum: [resolved, user, llm, default]
          description: >-
            How this value was obtained for THIS query (ADR 0008).
            `llm` (ADR 0011) is a value the LLM resolver produced with no
            corroborating record; it is kept distinct from `default`, which
            is a value this project chose and documented. An `llm` entry
            always carries an explanatory note and never a citation.
        source:
          type: string
          description: What looked the value up; present only when origin is resolved
        citation:
          type: string
          description: Citation supporting THIS value; present only when origin is resolved
        organism:
          type: string
          description: Organism for this value; present only when origin is resolved
        citationStatus:
          type: string
          enum: [verified, flagged]
          description: >-
            Whether the resolved citation is an exact organism/substrate match
            (verified) or a cross-species fallback (flagged). Present only
            when origin is resolved (Stage 5 Part 3).
        assayConditions:
          $ref: "#/components/schemas/AssayConditions"
        strendaStatus:
          type: string
          enum: [complete, incomplete]
          description: >-
            Whether the assay conditions meet STRENDA's minimum reporting
            requirement (pH + temperature). Present only for resolved kinetic
            constants (ADR 0010).
        citationLocators:
          type: array
          description: >-
            Machine-checkable locators for the citation (citeVerify.ts):
            `(kind, value, deepLink)` triples so a human or tool can re-find
            the exact source of this number. Present only when origin is
            resolved.
          items:
            $ref: "#/components/schemas/CitationLocator"
        note:
          type: string
          description: Why a lookup was attempted and failed, if so
      required:
        - origin
    CitationLocator:
      type: object
      properties:
        kind:
          type: string
          enum: [brenda_ref, brenda_ec, pubmed, doi, url]
          description: What kind of locator this is
        value:
          type: string
          description: The locator's value (BRENDA ref id, EC number, PMID, DOI, or URL)
        deepLink:
          type: string
          description: >-
            Canonical URL that re-finds this locator, when one exists. Absent
            for brenda_ref because BRENDA has no working per-reference deep
            link (live-checked 2026-07).
      required:
        - kind
        - value
    AssayConditions:
      type: object
      properties:
        ph:
          type: number
          description: Assay pH (STRENDA-mandatory when reported)
        temperatureC:
          type: number
          description: Assay temperature in degrees Celsius (STRENDA-mandatory)
        buffer:
          type: string
          description: Buffer system, when reported
      required: []
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Short error code
        message:
          type: string
          description: Human-readable error message
      required:
        - error
        - message
