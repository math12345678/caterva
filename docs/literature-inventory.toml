[seir.sigma]
value = "0.2"
status = "UNVERIFIED"
note = "Teaching default (1/sigma = 5 d latent period). NOT resolved. Searched 2026-08-09 and again 2026-08-11 (PubMed + Consensus); the second search closed the question rather than leaving it open. ADR 0017's registry pairs R0 with a SERIAL INTERVAL only; sigma needs a LATENT period (infection -> infectiousness), which is a different quantity from both the serial interval and the incubation period (infection -> symptoms), and the three are routinely conflated. THE SUBSTITUTION IS NOT MERELY UNTIDY, IT IS DIRECTIONALLY WRONG: pooled meta-analytic serial interval (5.2 d) is SHORTER than pooled incubation (6.5 d) -- Alene et al. 2021, BMC Infect Dis 21:257, DOI 10.1186/s12879-021-05950-x, PMID 33706702 -- which is the signature of substantial PREsymptomatic transmission, so infectiousness begins before symptoms and the latent period is strictly shorter than the incubation period. Using an incubation figure for sigma would therefore overstate the latent period and systematically under-predict early epidemic speed. Two further meta-analyses report incubation only, not latent: Elias et al. 2021, Int J Infect Dis 104:708-710, DOI 10.1016/j.ijid.2021.01.069, PMID 33548553 (99 studies, pooled 6.38 d, 95% CI 5.79-6.97); Wu et al. 2022, JAMA Netw Open 5(8):e2228008, DOI 10.1001/jamanetworkopen.2022.28008, PMID 35994285 (142 studies, pooled 6.57 d). Candidate rejected #1: Hou et al. (2020) J Med Virol 92(7) 841-848, DOI 10.1002/jmv.25827, PMID 32243599 -- a single-city SEIR fit whose abstract states other parameters were 'suppose as unchanged'. It ASSUMES a latent period rather than measuring one, so citing it would launder an assumption into a citation, which is the exact failure ADR 0017 refused for measles and influenza. Candidate rejected #2: Kang et al. 2022, Eurosurveillance 27(10), reports a directly MEASURED mean latent period of 3.9 d -- but for the DELTA variant, while this registry entry is the ancestral strain, whose serial interval (5.45 d, Hussein et al.) comes from ancestral-strain data. Delta's serial interval is 3.9 d (Madewell et al. 2023, BMC Infect Dis 23:429, DOI 10.1186/s12879-023-08407-5, PMID 37365505), i.e. materially different, so pairing a Delta latent period with an ancestral serial interval would stitch two incompatible parameter sets together -- precisely what this registry's same-source rule forbids. Promotion to RESOLVED requires a source reporting R0 and a MEASURED latent period for the SAME disease AND the same variant/era under compatible methodology. The honest resolution may instead be a per-variant registry, since incubation is now known to be strongly variant-dependent (Wu et al.: Alpha 5.00 d, Beta 4.50 d, Delta 4.41 d, Omicron 3.42 d)."

[seir.s0]
value = "990"
status = "UNVERIFIED"
note = "See sir.s0."

[seir.e0]
value = "10"
status = "UNVERIFIED"
note = "Teaching default: initial exposed cohort."

[seir.i0]
value = "0"
status = "UNVERIFIED"
note = "Teaching default. NOTE: i0=0 currently disables the R0 plausibility check entirely (validate_sir_params returns early) — see STAGE_10_PART_01 item 1."

[seir.r0_recovered]
value = "0"
status = "UNVERIFIED"

[seir.end]
value = "100"
status = "NOT_SCIENTIFIC"

[seir.points]
value = "101"
status = "NOT_SCIENTIFIC"

